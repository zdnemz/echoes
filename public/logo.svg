<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hard offset shadow -->
  <rect x="8" y="8" width="52" height="52" fill="#FF3B00"/>
  <!-- Main square badge -->
  <rect x="4" y="4" width="52" height="52" fill="#0A0A0A"/>
  <!-- Echoes geometric soundwave -->
  <g fill="none">
    <!-- Origin square -->
    <rect x="13" y="27" width="9" height="10" fill="#FFFFFF"/>
    <!-- Wave 1 (white) -->
    <path d="M28 21 H34 V43 H28" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Wave 2 (white) -->
    <path d="M39 15 H45 V49 H39" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Wave 3 (accent) -->
    <path d="M49 9 H53 V55 H49" stroke="#FF3B00" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
